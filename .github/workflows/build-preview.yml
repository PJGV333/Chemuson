name: Build Preview

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**-prep"

permissions:
  contents: read

concurrency:
  group: chemuson-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate preview source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      branch: ${{ steps.identity.outputs.branch }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate branch, canonical version and exact SHA
        id: identity
        run: python packaging/release/preview_build.py prepare

  preflight_rehearsal:
    name: Release preflight rehearsal (non-publishing)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIEW_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout exact candidate commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail closed if the candidate tag already exists on the remote
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${PREVIEW_VERSION}")" ]; then
            echo "ERROR: refs/tags/v${PREVIEW_VERSION} already exists on origin; the rehearsal must not run against a published tag." >&2
            exit 1
          fi

      - name: Create temporary annotated tag inside this runner only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${PREVIEW_VERSION}" -m "ChemUSON release preflight rehearsal; temporary, never published" "${PREVIEW_SHA}"
          test "$(git rev-parse "refs/tags/v${PREVIEW_VERSION}^{commit}")" = "${PREVIEW_SHA}"

      - name: Run the real release preflight under a simulated tag event
        env:
          RELEASE_PREFLIGHT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${PREVIEW_VERSION}"
          EVENT_PATH="${RUNNER_TEMP}/rehearsal-tag-event.json"
          OUTPUT_FILE="${RUNNER_TEMP}/rehearsal-preflight-outputs.txt"
          : > "${OUTPUT_FILE}"
          printf '{"ref":"refs/tags/%s","ref_type":"tag","deleted":false}\n' "${TAG}" > "${EVENT_PATH}"
          export GITHUB_REF_NAME="${TAG}"
          export GITHUB_REF_TYPE="tag"
          export GITHUB_SHA="${PREVIEW_SHA}"
          export GITHUB_EVENT_PATH="${EVENT_PATH}"
          export GITHUB_OUTPUT="${OUTPUT_FILE}"
          python - <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, "packaging/release")
          import validate_release_tag

          toplevel = subprocess.run(
              ["git", "rev-parse", "--show-toplevel"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if str(validate_release_tag.REPO_ROOT) != toplevel:
              raise SystemExit(
                  f"REPO_ROOT {validate_release_tag.REPO_ROOT} differs from git toplevel {toplevel}"
              )
          print(f"Path resolution check: REPO_ROOT == git toplevel == {toplevel}")
          PY
          python packaging/release/validate_release_tag.py
          test -s "${OUTPUT_FILE}"
          cat "${OUTPUT_FILE}"

      - name: Verify preflight outputs match the candidate identity
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/rehearsal-preflight-outputs.txt"
          case "${PREVIEW_VERSION}" in
            *-beta.*|*-rc.*) EXPECTED_CHANNEL="beta" ;;
            *) EXPECTED_CHANNEL="stable" ;;
          esac
          grep -qxF "tag=v${PREVIEW_VERSION}" "${OUTPUT_FILE}"
          grep -qxF "version=${PREVIEW_VERSION}" "${OUTPUT_FILE}"
          grep -qxF "channel=${EXPECTED_CHANNEL}" "${OUTPUT_FILE}"
          grep -qxF "sha=${PREVIEW_SHA}" "${OUTPUT_FILE}"
          {
            echo "## Release preflight rehearsal (non-publishing)"
            echo ""
            echo "- Validator: \`packaging/release/validate_release_tag.py\` (exact official code)"
            echo "- Temporary annotated tag: \`v${PREVIEW_VERSION}\` created and deleted inside this runner only"
            echo "- Simulated tag event: ref, ref_type, event file, GITHUB_SHA and GITHUB_OUTPUT"
            echo "- GitHub lookup token: repository \`github.token\` with \`contents: read\`"
            echo "- Preflight exit code: **0**; outputs tag/version/channel/sha matched"
            echo "- Official tag published by this rehearsal: **never**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the temporary local tag
        if: always()
        run: |
          set -euo pipefail
          git tag -d "v${PREVIEW_VERSION}"
          test -z "$(git tag -l "v${PREVIEW_VERSION}")"
          test -z "$(git ls-remote --tags origin "refs/tags/v${PREVIEW_VERSION}")"

  release_gate_rehearsal:
    name: Release gate bounded checks rehearsal
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact candidate commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Validate exact baseline exception catalog
        run: python packaging/release/validate_baseline_exceptions.py

      - name: Run Python ChemName acceptance
        run: python tools/chemname_acceptance.py --quiet --report "$RUNNER_TEMP/chemname-source-acceptance.json"

      - name: Compile source, tests and packaging tools
        run: python -m compileall -q src tests tools packaging

      - name: Run scoped release Ruff checks
        run: >-
          ruff check packaging/release/release_policy.py
          packaging/release/validate_release_tag.py
          packaging/release/validate_release_artifacts.py
          packaging/release/validate_baseline_exceptions.py
          packaging/release/preview_build.py
          packaging/release/write_build_provenance.py
          packaging/release/generate_channel_manifest.py
          tests/test_release_tag_validation.py
          tests/test_release_artifacts.py
          tests/test_baseline_exception_catalog.py
          tests/test_preview_build.py
          tests/test_preview_workflow_contract.py
          tests/test_release_workflow_contract.py
          tests/test_test_workflow_contract.py
          tests/test_appimage_validation.py
          tests/test_linux_distribution_scripts.py
          tests/test_flatpak_toolchain_preparation.py
          tests/test_packaged_icon_smoke.py
          packaging/release/validate_appimage.py
          packaging/release/validate_packaged_icons.py
          packaging/release/validate_packaged_rdkit_worker.py
          packaging/release/validate_packaged_chemname.py
          tests/test_packaged_chemname_smoke.py
          tests/test_chemname_packaged_smoke.py
          tests/test_rdkit_packaged_worker.py
          tests/test_rdkit_descriptors.py
          tests/test_application_startup_non_qt.py
          tests/test_ui_polish.py
          tests/test_smiles_import_isolated.py
          src/chemuson/__main__.py
          src/chemuson/chemio/rdkit_safe.py
          src/chemuson/chemio/rdkit_packaged_smoke.py
          src/chemuson/chemio/_rdkit_worker.py
          src/chemuson/chemio/rdkit_io.py
          src/chemuson/gui/main_window.py
          --select F401,F811,F821,E722,E741

      - name: Run architecture tests on validated tag SHA
        run: timeout 5m python -m pytest -q tests/architecture

      - name: Run bounded release, version, packaging and workflow contracts
        run: >-
          timeout 8m python -m pytest -q
          tests/test_release_version_script.py
          tests/test_version_metadata.py
          tests/test_update_semver.py
          tests/test_update_policy.py
          tests/test_update_core.py
          tests/test_update_provider.py
          tests/test_update_security.py
          tests/test_update_portable.py
          tests/test_update_windows.py
          tests/test_update_telemetry.py
          tests/test_update_ui_text.py
          tests/test_release_tag_validation.py
          tests/test_release_artifacts.py
          tests/test_baseline_exception_catalog.py
          tests/test_preview_build.py
          tests/test_preview_workflow_contract.py
          tests/test_release_workflow_contract.py
          tests/test_test_workflow_contract.py
          tests/test_appimage_validation.py
          tests/test_linux_distribution_scripts.py
          tests/test_flatpak_toolchain_preparation.py
          tests/test_packaged_icon_smoke.py
          tests/test_rdkit_packaged_worker.py
          tests/test_rdkit_descriptors.py
          tests/test_application_startup_non_qt.py
          tests/test_smiles_import_isolated.py
          tests/test_ui_polish.py

      - name: Write gate rehearsal summary
        run: |
          {
            echo "## Release gate bounded checks rehearsal"
            echo ""
            echo "- Mirrors every bounded step of the official \`release_gate\` job after its preflight"
            echo "- Same runner (\`ubuntu-latest\`), Python 3.11, Qt runtime packages, editable install"
            echo "- Commands asserted byte-for-byte against \`release.yml\` by static contracts"
            echo "- No publication step executed: the tag preflight itself is covered by the rehearsal job"
          } >> "$GITHUB_STEP_SUMMARY"

  build_windows:
    name: Windows portable and installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIEW_SHA: ${{ needs.prepare.outputs.sha }}
      PREVIEW_SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PREVIEW_BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - name: Checkout validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact source identity
        shell: pwsh
        run: >-
          python packaging/release/preview_build.py verify
          --version "$env:PREVIEW_VERSION"
          --git-sha "$env:PREVIEW_SHA"
          --source-branch "$env:PREVIEW_BRANCH"

      - name: Install package dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Python ChemName acceptance before freezing
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python tools/chemname_acceptance.py --quiet --report "$env:RUNNER_TEMP\chemname-source-acceptance.json"
          if ($LASTEXITCODE -ne 0) { throw "Python ChemName acceptance failed (exit $LASTEXITCODE)." }

      - name: Build portable executable and Inno installer
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm chemuson.spec
          if (-not (Test-Path "dist\Chemuson.exe")) { throw "Portable executable was not generated." }
          python packaging/release/validate_packaged_icons.py --executable "dist/Chemuson.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged icon validation failed (exit $LASTEXITCODE)." }
          python packaging/release/validate_packaged_rdkit_worker.py --executable "dist/Chemuson.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged RDKit validation failed (exit $LASTEXITCODE)." }
          python packaging/release/validate_packaged_chemname.py --executable "dist/Chemuson.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged ChemName validation failed (exit $LASTEXITCODE)." }
          choco install innosetup --no-progress -y
          $env:CHEMUSON_VERSION = $env:PREVIEW_VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\Chemuson.iss"
          $installer = "dist-installer\Chemuson-v$env:PREVIEW_VERSION-windows-x86_64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Inno installer was not generated: $installer" }

          New-Item -ItemType Directory -Force -Path preview-windows-portable, preview-windows-installer | Out-Null
          $portableName = "Chemuson-v$env:PREVIEW_VERSION-preview-$env:PREVIEW_SHORT_SHA-windows-x86_64-portable.exe"
          $installerName = "Chemuson-v$env:PREVIEW_VERSION-preview-$env:PREVIEW_SHORT_SHA-windows-x86_64-setup.exe"
          Copy-Item "dist\Chemuson.exe" "preview-windows-portable\$portableName"
          Copy-Item $installer "preview-windows-installer\$installerName"

      - name: Verify files and write checksums/provenance
        shell: pwsh
        run: |
          $portableName = "Chemuson-v$env:PREVIEW_VERSION-preview-$env:PREVIEW_SHORT_SHA-windows-x86_64-portable.exe"
          $installerName = "Chemuson-v$env:PREVIEW_VERSION-preview-$env:PREVIEW_SHORT_SHA-windows-x86_64-setup.exe"
          python packaging/release/preview_build.py manifest --output-dir preview-windows-portable --version "$env:PREVIEW_VERSION" --git-sha "$env:PREVIEW_SHA" --source-branch "$env:PREVIEW_BRANCH" --operating-system "Windows / $env:RUNNER_OS-$env:RUNNER_ARCH" --files $portableName
          python packaging/release/preview_build.py manifest --output-dir preview-windows-installer --version "$env:PREVIEW_VERSION" --git-sha "$env:PREVIEW_SHA" --source-branch "$env:PREVIEW_BRANCH" --operating-system "Windows / $env:RUNNER_OS-$env:RUNNER_ARCH" --files $installerName

      - name: Upload Windows portable preview
        uses: actions/upload-artifact@v4
        with:
          name: chemuson-preview-windows-portable
          path: preview-windows-portable/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer preview
        uses: actions/upload-artifact@v4
        with:
          name: chemuson-preview-windows-installer
          path: preview-windows-installer/*
          if-no-files-found: error
          retention-days: 14

  build_linux_appimage:
    name: Linux AppImage Type 2
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIEW_SHA: ${{ needs.prepare.outputs.sha }}
      PREVIEW_SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PREVIEW_BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - name: Checkout validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream curl desktop-file-utils libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-icccm4 libxcb-shape0 libfontconfig1 libfreetype6 libgl1-mesa-dri xauth xvfb

      - name: Verify exact source identity
        run: >-
          python packaging/release/preview_build.py verify
          --version "$PREVIEW_VERSION"
          --git-sha "$PREVIEW_SHA"
          --source-branch "$PREVIEW_BRANCH"

      - name: Install package dependencies and build portable executable
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          PYTHONPATH=src python tools/chemname_acceptance.py --quiet --report "$RUNNER_TEMP/chemname-source-acceptance.json"
          pyinstaller --clean --noconfirm chemuson.spec
          test -s dist/Chemuson
          test -x dist/Chemuson
          python packaging/release/validate_packaged_icons.py --executable dist/Chemuson
          python packaging/release/validate_packaged_rdkit_worker.py --executable dist/Chemuson
          python packaging/release/validate_packaged_chemname.py --executable dist/Chemuson

      - name: Diagnose Qt xcb plugin loader before AppImage graphics smoke
        run: python packaging/release/diagnose_qt_xcb.py

      - name: Build preview portable package without updater metadata
        run: |
          bash packaging/linux/build_appimage.sh \
            "$PREVIEW_VERSION" "dist" "dist-preview" "" "" "beta" "" \
            "$PREVIEW_SHA" "preview" "$PREVIEW_BRANCH"
          APPIMAGE_NAME="Chemuson-v${PREVIEW_VERSION}-preview-${PREVIEW_SHORT_SHA}-linux-x86_64.AppImage"
          test -s "dist-preview/${APPIMAGE_NAME}"
          test -x "dist-preview/${APPIMAGE_NAME}"
          test ! -e "dist-preview/${APPIMAGE_NAME}.updateinfo"
          test ! -e "dist-preview/${APPIMAGE_NAME}.update.json"
          test ! -e "dist-preview/${APPIMAGE_NAME}.zsync"
          python packaging/release/validate_appimage.py \
            --appimage "dist-preview/${APPIMAGE_NAME}" \
            --version "$PREVIEW_VERSION" --source-sha "$PREVIEW_SHA" \
            --build-type preview
          mkdir -p preview-linux-appimage
          cp "dist-preview/${APPIMAGE_NAME}" preview-linux-appimage/
          python packaging/release/preview_build.py manifest \
            --output-dir preview-linux-appimage \
            --version "$PREVIEW_VERSION" --git-sha "$PREVIEW_SHA" \
            --source-branch "$PREVIEW_BRANCH" \
            --operating-system "Linux / ${RUNNER_OS}-${RUNNER_ARCH}" \
            --files "$APPIMAGE_NAME"

      - name: Upload Linux portable preview
        uses: actions/upload-artifact@v4
        with:
          name: chemuson-preview-linux-appimage
          path: preview-linux-appimage/*
          if-no-files-found: error
          retention-days: 14

  build_linux_flatpak:
    name: Linux Flatpak bundle
    needs: prepare
    # Imagen fijada: el cierre del toolchain Flatpak y el comportamiento de apt
    # quedan medidos sobre Ubuntu 24.04; `ubuntu-latest` podría cambiar de base.
    runs-on: ubuntu-24.04
    # Presupuesto sin cambios: la preparación queda acotada dentro del paso y
    # el empaquetado real historico ocupa alrededor de 4 min.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIEW_SHA: ${{ needs.prepare.outputs.sha }}
      PREVIEW_SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PREVIEW_BRANCH: ${{ needs.prepare.outputs.branch }}
      CHEMUSON_FLATPAK_APT_PACKAGES: flatpak flatpak-builder ostree
      CHEMUSON_FLATPAK_APT_CACHE_DIR: ${{ runner.temp }}/chemuson-flatpak-apt
    steps:
      - name: Checkout validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore verified Flatpak toolchain package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # actions/cache v6.1.0, accion oficial de GitHub
        with:
          path: ${{ runner.temp }}/chemuson-flatpak-apt
          key: flatpak-apt-v1-preview-${{ hashFiles('packaging/flatpak/toolchain.lock') }}-${{ github.run_id }}
          restore-keys: |
            flatpak-apt-v1-preview-${{ hashFiles('packaging/flatpak/toolchain.lock') }}-
            flatpak-apt-v1-preview-

      - name: Install Flatpak build tools
        run: bash packaging/linux/install_flatpak_tools.sh

      - name: Verify exact source identity
        run: >-
          python packaging/release/preview_build.py verify
          --version "$PREVIEW_VERSION"
          --git-sha "$PREVIEW_SHA"
          --source-branch "$PREVIEW_BRANCH"

      - name: Build local Flatpak bundle only
        run: |
          bash packaging/linux/build_flatpak.sh \
            "$PREVIEW_VERSION" "beta" "dist-flatpak-preview" \
            "packaging/flatpak/io.github.PJGV333.Chemuson.yml" \
            "preview" "$PREVIEW_SHA" "$PREVIEW_BRANCH"
          FLATPAK_NAME="Chemuson-v${PREVIEW_VERSION}-preview-${PREVIEW_SHORT_SHA}-linux-x86_64.flatpak"
          test -s "dist-flatpak-preview/${FLATPAK_NAME}"
          mkdir -p preview-linux-flatpak
          cp "dist-flatpak-preview/${FLATPAK_NAME}" preview-linux-flatpak/
          python packaging/release/preview_build.py manifest \
            --output-dir preview-linux-flatpak \
            --version "$PREVIEW_VERSION" --git-sha "$PREVIEW_SHA" \
            --source-branch "$PREVIEW_BRANCH" \
            --operating-system "Linux / ${RUNNER_OS}-${RUNNER_ARCH} (Flatpak)" \
            --files "$FLATPAK_NAME"

      - name: Upload Linux Flatpak preview
        uses: actions/upload-artifact@v4
        with:
          name: chemuson-preview-linux-flatpak
          path: preview-linux-flatpak/*
          if-no-files-found: error
          retention-days: 14

  preview_report:
    name: Preview build report
    if: always()
    needs: [prepare, preflight_rehearsal, release_gate_rehearsal, build_windows, build_linux_appimage, build_linux_flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write per-platform status report
        env:
          PREPARE_STATUS: ${{ needs.prepare.result }}
          PREFLIGHT_REHEARSAL_STATUS: ${{ needs.preflight_rehearsal.result }}
          GATE_REHEARSAL_STATUS: ${{ needs.release_gate_rehearsal.result }}
          WINDOWS_STATUS: ${{ needs.build_windows.result }}
          APPIMAGE_STATUS: ${{ needs.build_linux_appimage.result }}
          FLATPAK_STATUS: ${{ needs.build_linux_flatpak.result }}
          PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
          PREVIEW_SHA: ${{ needs.prepare.outputs.sha }}
          PREVIEW_BRANCH: ${{ needs.prepare.outputs.branch }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          statuses = {
              "source_validation": os.environ["PREPARE_STATUS"],
              "release_preflight_rehearsal": os.environ["PREFLIGHT_REHEARSAL_STATUS"],
              "release_gate_bounded_rehearsal": os.environ["GATE_REHEARSAL_STATUS"],
              "windows_portable_and_installer": os.environ["WINDOWS_STATUS"],
              "linux_appimage_portable": os.environ["APPIMAGE_STATUS"],
              "linux_flatpak": os.environ["FLATPAK_STATUS"],
          }
          complete = all(value == "success" for value in statuses.values())
          report = {
              "version": os.environ.get("PREVIEW_VERSION", ""),
              "build_type": "preview",
              "git_sha": os.environ.get("PREVIEW_SHA", "") or os.environ["EVENT_SHA"],
              "source_branch": os.environ.get("PREVIEW_BRANCH", "") or os.environ["EVENT_BRANCH"],
              "build_time_utc": datetime.now(timezone.utc).isoformat(),
              "publication": False,
              "build_status": "success" if complete else "failure",
              "complete": complete,
              "jobs": statuses,
          }
          Path("preview-build-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## ChemUSON preview build\n\n"
              f"- Version: `{report['version'] or 'unavailable'}`\n"
              f"- Branch: `{report['source_branch']}`\n"
              f"- SHA: `{report['git_sha']}`\n"
              f"- Overall: **{report['build_status'].upper()}**\n\n"
              + "\n".join(f"- {name}: **{status.upper()}**" for name, status in statuses.items())
              + "\n\nPublication: **false**\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2))
          if not complete:
              raise SystemExit("Preview is incomplete; at least one build job did not succeed.")
          PY

      - name: Upload preview status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemuson-preview-build-report
          path: preview-build-report.json
          if-no-files-found: error
          retention-days: 14
