name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión SemVer a publicar (ej. 0.2.2 o 0.2.2-beta.1)"
        required: true
        default: "0.2.3-beta.3"
      channel:
        description: "Canal de publicación (beta para testers, stable para usuarios finales)"
        required: true
        default: "beta"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
            if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sync app version
        shell: pwsh
        run: |
          python packaging/release/set_version.py --version "${{ steps.vars.outputs.version }}"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm chemuson.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:CHEMUSON_VERSION = "${{ steps.vars.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\Chemuson.iss"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item dist\Chemuson.exe "release-assets\Chemuson-v${{ steps.vars.outputs.version }}-windows-x86_64-portable.exe"
          Copy-Item dist-installer\Chemuson-v${{ steps.vars.outputs.version }}-windows-x86_64-setup.exe "release-assets\Chemuson-v${{ steps.vars.outputs.version }}-windows-x86_64-setup.exe"

      - name: Sign windows artifacts (Authenticode, optional)
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $timestamp = "http://timestamp.digicert.com"
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_TIMESTAMP_URL)) {
            $timestamp = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
          }
          & "packaging\windows\sign_artifacts.ps1" -InputDir "release-assets" -TimestampUrl $timestamp

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets/*

  build_linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            if echo "${VERSION}" | grep -qi "beta"; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Sync app version
        run: |
          python packaging/release/set_version.py --version "${{ steps.vars.outputs.version }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build linux portable
        run: pyinstaller --clean --noconfirm chemuson.spec

      - name: Build AppImage artifact + update metadata
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          bash packaging/linux/build_appimage.sh \
            "${{ steps.vars.outputs.version }}" \
            "dist" \
            "dist-appimage" \
            "${OWNER}" \
            "${REPO}" \
            "${{ steps.vars.outputs.channel }}" \
            "${{ steps.vars.outputs.tag }}"

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp dist-appimage/* release-assets/

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets/*

  build_flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version/channel
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if echo "${VERSION}" | grep -qi "beta"; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Resolve Flatpak remote URLs
        id: remote
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          OWNER_LOWER="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO}" = "${OWNER}.github.io" ]; then
            PAGES_BASE="https://${OWNER_LOWER}.github.io"
          else
            PAGES_BASE="https://${OWNER_LOWER}.github.io/${REPO}"
          fi
          echo "pages_base=${PAGES_BASE}" >> "$GITHUB_OUTPUT"
          echo "repo_url=${PAGES_BASE}/flatpak/${{ steps.vars.outputs.channel }}/repo/" >> "$GITHUB_OUTPUT"
          echo "icon_url=${PAGES_BASE}/flatpak/icon.svg" >> "$GITHUB_OUTPUT"

      - name: Sync app version
        run: |
          python packaging/release/set_version.py --version "${{ steps.vars.outputs.version }}"

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg ostree

      - name: Import Flatpak signing key (optional)
        id: signing
        env:
          FLATPAK_GPG_PRIVATE_KEY_BASE64: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY_BASE64 }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          if [ -z "${FLATPAK_GPG_PRIVATE_KEY_BASE64:-}" ] || [ -z "${FLATPAK_GPG_KEY_ID:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          PRIVATE_KEY_FILE="${RUNNER_TEMP}/flatpak-signing-private.asc"
          PUBLIC_KEY_FILE="${RUNNER_TEMP}/flatpak-signing-public.gpg"
          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY_BASE64}" | base64 -d > "${PRIVATE_KEY_FILE}"
          gpg --batch --homedir "${GNUPGHOME}" --import "${PRIVATE_KEY_FILE}"
          gpg --batch --homedir "${GNUPGHOME}" --export "${FLATPAK_GPG_KEY_ID}" > "${PUBLIC_KEY_FILE}"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "key_id=${FLATPAK_GPG_KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "gpg_homedir=${GNUPGHOME}" >> "$GITHUB_OUTPUT"
          echo "public_key_file=${PUBLIC_KEY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak bundle
        env:
          CHEMUSON_FLATPAK_REPO_URL: ${{ steps.remote.outputs.repo_url }}
          CHEMUSON_FLATPAK_ICON_URL: ${{ steps.remote.outputs.icon_url }}
          CHEMUSON_FLATPAK_GPG_KEY_ID: ${{ steps.signing.outputs.key_id }}
          CHEMUSON_FLATPAK_GPG_HOMEDIR: ${{ steps.signing.outputs.gpg_homedir }}
          CHEMUSON_FLATPAK_PUBLIC_KEY_FILE: ${{ steps.signing.outputs.public_key_file }}
        run: |
          bash packaging/linux/build_flatpak.sh \
            "${{ steps.vars.outputs.version }}" \
            "${{ steps.vars.outputs.channel }}" \
            "dist-flatpak" \
            "packaging/flatpak/io.github.PJGV333.Chemuson.yml"

      - name: Validate Flatpak build output
        run: |
          python packaging/release/validate_flatpak_remote_artifacts.py \
            --mode build-output \
            --root "dist-flatpak" \
            --channel "${{ steps.vars.outputs.channel }}" \
            --basename "Chemuson"

      - name: Collect Flatpak artifacts
        run: |
          mkdir -p release-assets
          cp dist-flatpak/Chemuson-v${{ steps.vars.outputs.version }}-linux-x86_64.flatpak release-assets/
          cp "dist-flatpak/Chemuson-${{ steps.vars.outputs.channel }}.flatpakref" release-assets/
          cp "dist-flatpak/Chemuson-${{ steps.vars.outputs.channel }}.flatpakrepo" release-assets/

      - name: Prepare Flatpak remote payload
        run: |
          mkdir -p flatpak-remote/${{ steps.vars.outputs.channel }}/repo
          cp -a dist-flatpak/repo/. flatpak-remote/${{ steps.vars.outputs.channel }}/repo/
          cp "dist-flatpak/Chemuson-${{ steps.vars.outputs.channel }}.flatpakref" "flatpak-remote/${{ steps.vars.outputs.channel }}/"
          cp "dist-flatpak/Chemuson-${{ steps.vars.outputs.channel }}.flatpakrepo" "flatpak-remote/${{ steps.vars.outputs.channel }}/"
          install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.svg flatpak-remote/icon.svg

      - name: Validate Flatpak remote payload
        run: |
          python packaging/release/validate_flatpak_remote_artifacts.py \
            --mode publish-payload \
            --root "flatpak-remote" \
            --channel "${{ steps.vars.outputs.channel }}" \
            --basename "Chemuson"

      - name: Archive Flatpak remote payload
        run: |
          tar -cf flatpak-remote.tar -C flatpak-remote .

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-artifacts
          path: release-assets/*

      - name: Upload Flatpak remote payload
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-remote-${{ steps.vars.outputs.channel }}
          path: flatpak-remote.tar

  release:
    needs: [build_windows, build_linux, build_flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version/channel
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            if echo "${VERSION}" | grep -qi "beta"; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          path: release-assets

      - name: Flatten artifact folders
        run: |
          mkdir -p release-dist
          find release-assets -maxdepth 4 -type f -print -exec cp {} release-dist/ \;

      - name: Generate checksums
        run: python packaging/release/generate_checksums.py --dir release-dist

      - name: Sign artifacts (HMAC)
        env:
          CHEMUSON_SIGN_KEY: ${{ secrets.CHEMUSON_SIGN_KEY }}
        run: |
          if [ -n "${CHEMUSON_SIGN_KEY:-}" ]; then
            python packaging/release/sign_hmac.py --dir release-dist
          else
            echo "CHEMUSON_SIGN_KEY not configured; skipping .sig generation"
          fi

      - name: Generate channel manifest
        env:
          CHEMUSON_SIGN_KEY: ${{ secrets.CHEMUSON_SIGN_KEY }}
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}"
          python packaging/release/generate_channel_manifest.py \
            --channel "${{ steps.vars.outputs.channel }}" \
            --version "${{ steps.vars.outputs.version }}" \
            --artifacts-dir release-dist \
            --base-url "${BASE_URL}" \
            --output "release-dist/${{ steps.vars.outputs.channel }}.json"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Chemuson v${{ steps.vars.outputs.version }}
          files: |
            release-dist/*
          draft: false
          prerelease: ${{ steps.vars.outputs.channel == 'beta' }}
          generate_release_notes: true

  publish_flatpak_remote:
    needs: [release, build_flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version/channel
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if echo "${VERSION}" | grep -qi "beta"; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub Pages URL
        id: pages
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          OWNER_LOWER="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO}" = "${OWNER}.github.io" ]; then
            PAGES_BASE="https://${OWNER_LOWER}.github.io"
          else
            PAGES_BASE="https://${OWNER_LOWER}.github.io/${REPO}"
          fi
          echo "pages_base=${PAGES_BASE}" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak remote payload
        uses: actions/download-artifact@v4
        with:
          name: flatpak-remote-${{ steps.vars.outputs.channel }}
          path: downloaded-flatpak-remote

      - name: Extract Flatpak remote payload
        run: |
          mkdir -p flatpak-remote
          TARBALL="$(find downloaded-flatpak-remote -type f -name 'flatpak-remote.tar' -print -quit)"
          if [ -z "${TARBALL}" ]; then
            echo "ERROR: flatpak-remote.tar was not found in downloaded artifact." >&2
            exit 1
          fi
          tar -xf "${TARBALL}" -C flatpak-remote

      - name: Install OSTree verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ostree gnupg

      - name: Validate downloaded Flatpak remote payload
        run: |
          python packaging/release/validate_flatpak_remote_artifacts.py \
            --mode publish-payload \
            --root "flatpak-remote" \
            --channel "${{ steps.vars.outputs.channel }}" \
            --basename "Chemuson"

      - name: Validate local Flatpak commit metadata
        run: |
          set -euo pipefail
          CHANNEL="${{ steps.vars.outputs.channel }}"
          APP_REF_PATH="flatpak-remote/${CHANNEL}/repo/refs/heads/app/io.github.PJGV333.Chemuson/x86_64/${CHANNEL}"

          EXPECTED_COMMIT="$(tr -d '\n' < "${APP_REF_PATH}")"
          if ! printf '%s' "${EXPECTED_COMMIT}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "ERROR: Invalid local OSTree commit checksum in ${APP_REF_PATH}: ${EXPECTED_COMMIT}" >&2
            exit 1
          fi

          COMMITMETA_PATH="flatpak-remote/${CHANNEL}/repo/objects/${EXPECTED_COMMIT:0:2}/${EXPECTED_COMMIT:2}.commitmeta"
          echo "Expected local Flatpak commit SHA: ${EXPECTED_COMMIT}"
          echo "Expected local commitmeta path: ${COMMITMETA_PATH}"

          if [ ! -f "${COMMITMETA_PATH}" ]; then
            echo "ERROR: Expected Flatpak commit metadata is missing from the publish payload: ${COMMITMETA_PATH}" >&2
            exit 1
          fi

      - name: Publish Flatpak remote to gh-pages
        run: |
          set -euo pipefail
          PUBLISH_DIR="$(mktemp -d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "${PUBLISH_DIR}" origin/gh-pages
            (
              cd "${PUBLISH_DIR}"
              git checkout -B gh-pages
            )
          else
            git worktree add -B gh-pages "${PUBLISH_DIR}" HEAD
            find "${PUBLISH_DIR}" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          mkdir -p "${PUBLISH_DIR}/flatpak"
          rm -rf "${PUBLISH_DIR}/flatpak/${{ steps.vars.outputs.channel }}"
          mkdir -p "${PUBLISH_DIR}/flatpak/${{ steps.vars.outputs.channel }}"
          cp -a flatpak-remote/${{ steps.vars.outputs.channel }}/. "${PUBLISH_DIR}/flatpak/${{ steps.vars.outputs.channel }}/"
          cp flatpak-remote/icon.svg "${PUBLISH_DIR}/flatpak/icon.svg"
          touch "${PUBLISH_DIR}/.nojekyll"
          python packaging/release/generate_flatpak_pages_index.py \
            --root "${PUBLISH_DIR}" \
            --basename "Chemuson"

          (
            cd "${PUBLISH_DIR}"
            git add .
            if git diff --cached --quiet; then
              echo "No Flatpak remote changes to publish."
              exit 0
            fi
            git commit -m "Publish Flatpak remote for ${{ steps.vars.outputs.channel }} v${{ steps.vars.outputs.version }}"
            git push origin gh-pages
          )

      - name: Verify GitHub Pages publication
        run: |
          set -euo pipefail
          CHANNEL="${{ steps.vars.outputs.channel }}"
          PAGES_BASE="${{ steps.pages.outputs.pages_base }}"
          MAX_ATTEMPTS="${PAGES_VERIFY_ATTEMPTS:-36}"
          SLEEP_SECONDS="${PAGES_VERIFY_SLEEP_SECONDS:-10}"

          check_url() {
            local url="$1"
            local description="$2"
            local attempt

            for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
              echo "Checking ${description} (${attempt}/${MAX_ATTEMPTS}) with HEAD: ${url}"
              if curl -fsSLI "${url}" >/dev/null; then
                return 0
              fi

              echo "Checking ${description} (${attempt}/${MAX_ATTEMPTS}) with GET: ${url}"
              if curl -fsSL "${url}" >/dev/null; then
                return 0
              fi

              if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
                sleep "${SLEEP_SECONDS}"
              fi
            done

            echo "ERROR: ${description} was not reachable after ${MAX_ATTEMPTS} attempts: ${url}" >&2
            return 1
          }

          EXPECTED_REF_PATH="flatpak-remote/${CHANNEL}/repo/refs/heads/app/io.github.PJGV333.Chemuson/x86_64/${CHANNEL}"
          EXPECTED_COMMIT="$(tr -d '\n' < "${EXPECTED_REF_PATH}")"
          if ! printf '%s' "${EXPECTED_COMMIT}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "ERROR: Invalid local OSTree commit checksum in ${EXPECTED_REF_PATH}: ${EXPECTED_COMMIT}" >&2
            exit 1
          fi

          APP_REF_URL="${PAGES_BASE}/flatpak/${CHANNEL}/repo/refs/heads/app/io.github.PJGV333.Chemuson/x86_64/${CHANNEL}"
          COMMITMETA_URL="${PAGES_BASE}/flatpak/${CHANNEL}/repo/objects/${EXPECTED_COMMIT:0:2}/${EXPECTED_COMMIT:2}.commitmeta"
          COMMITMETA_PATH="flatpak-remote/${CHANNEL}/repo/objects/${EXPECTED_COMMIT:0:2}/${EXPECTED_COMMIT:2}.commitmeta"

          echo "Expected local Flatpak commit SHA: ${EXPECTED_COMMIT}"
          echo "Expected local commitmeta path: ${COMMITMETA_PATH}"
          echo "Expected public commitmeta URL: ${COMMITMETA_URL}"

          check_url "${PAGES_BASE}/index.html" "GitHub Pages index"
          check_url "${PAGES_BASE}/flatpak/${CHANNEL}/Chemuson-${CHANNEL}.flatpakref" "Flatpak ref"
          check_url "${PAGES_BASE}/flatpak/${CHANNEL}/Chemuson-${CHANNEL}.flatpakrepo" "Flatpak repo file"
          check_url "${PAGES_BASE}/flatpak/${CHANNEL}/repo/summary" "OSTree summary"
          check_url "${PAGES_BASE}/flatpak/${CHANNEL}/repo/summary.sig" "OSTree summary signature"
          check_url "${APP_REF_URL}" "OSTree app ref"

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            APP_COMMIT="$(curl -fsSL "${APP_REF_URL}" | tr -d '\n' || true)"
            echo "Published Flatpak commit SHA (${attempt}/${MAX_ATTEMPTS}): ${APP_COMMIT:-<unavailable>}"

            if ! printf '%s' "${APP_COMMIT}" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "Published app ref is not a valid OSTree checksum yet: ${APP_REF_URL}"
            elif [ "${APP_COMMIT}" = "${EXPECTED_COMMIT}" ]; then
              check_url "${COMMITMETA_URL}" "OSTree commit metadata"
              exit 0
            else
              echo "Published app ref still points to an older commit; expected ${EXPECTED_COMMIT}"
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep "${SLEEP_SECONDS}"
            fi
          done

          echo "ERROR: GitHub Pages did not publish the expected Flatpak commit after ${MAX_ATTEMPTS} attempts." >&2
          echo "Expected: ${EXPECTED_COMMIT}" >&2
          echo "Last published: ${APP_COMMIT:-<unavailable>}" >&2
          exit 1
