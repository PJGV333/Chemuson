name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      shard-matrix: ${{ steps.create-plan.outputs.shard-matrix }}
      total-tests: ${{ steps.create-plan.outputs.total-tests }}
      distribution: ${{ steps.create-plan.outputs.distribution }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Collect and plan the complete pytest suite
        id: create-plan
        timeout-minutes: 6
        run: >-
          timeout --signal=TERM --kill-after=5s 5m
          python tools/ci_pytest_shards.py plan
          --shards 8
          --expected tests/ci/expected_pytest_nodeids.txt
          --output "${RUNNER_TEMP}/pytest-plan.json"
          --github-output "${GITHUB_OUTPUT}"

      - name: Upload exact collection plan
        uses: actions/upload-artifact@v4
        with:
          name: pytest-plan
          path: ${{ runner.temp }}/pytest-plan.json
          if-no-files-found: error
          retention-days: 7

  pytest-shard:
    name: pytest shard ${{ matrix.shard }}
    needs: pytest-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.pytest-plan.outputs.shard-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Download exact collection plan
        uses: actions/download-artifact@v4
        with:
          name: pytest-plan
          path: ${{ runner.temp }}

      - name: Execute one externally bounded shard
        timeout-minutes: 6
        run: >-
          python tools/ci_pytest_shards.py run
          --plan "${RUNNER_TEMP}/pytest-plan.json"
          --shard-index "${{ matrix.shard }}"
          --timeout-seconds 300
          --expected tests/ci/expected_pytest_nodeids.txt
          --output-dir "${RUNNER_TEMP}"

      - name: Upload shard log, JUnit and process report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.xml
            ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 7

  pytest-summary:
    if: always()
    needs: [pytest-plan, pytest-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download plan and all shard artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-*
          path: ${{ runner.temp }}/pytest-artifacts
          merge-multiple: false

      - name: Verify full collection, execution counts and every shard outcome
        if: always()
        run: >-
          python tools/ci_pytest_shards.py verify
          --artifacts "${RUNNER_TEMP}/pytest-artifacts"
          --expected tests/ci/expected_pytest_nodeids.txt
          --shard-count 8
          --plan-status "${{ needs.pytest-plan.result }}"
          --shards-status "${{ needs.pytest-shard.result }}"

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run windows updater smoke tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          pytest -q tests/test_update_windows.py

      - name: Build installer smoke (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist\Chemuson.exe -Encoding Ascii -Value "stub portable binary for CI smoke"
          choco install innosetup --no-progress -y
          $env:CHEMUSON_VERSION = "0.0.0-ci"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\Chemuson.iss"
          if (-not (Test-Path "dist-installer\Chemuson-v0.0.0-ci-windows-x86_64-setup.exe")) {
            throw "No se generó instalador esperado."
          }

  flatpak-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Validate Flatpak manifest
        run: |
          flatpak-builder --show-manifest packaging/flatpak/io.github.PJGV333.Chemuson.yml > /tmp/flatpak-manifest.json
