[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemuson"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "PyQt6",
  "numpy",
  "Pillow",
  "rdkit",
  "certifi",
]

[project.scripts]
chemuson = "chemuson.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemuson = ["assets/**/*", "**/*.png", "**/*.svg", "**/*.json", "**/*.ui", "**/*.mol"]

[tool.setuptools.dynamic]
version = {attr = "chemuson._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
norecursedirs = [
  ".git",
  ".venv",
  ".venv_packaging",
  "build",
  "dist",
  "dist-appimage",
  "dist-flatpak",
  "packaging",
]
