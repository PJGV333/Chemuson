app-id: io.github.PJGV333.Chemuson
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: chemuson

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --env=CHEMUSON_DISABLE_UPDATE_CHECK=1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: python3-pyqt6-qt6
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pyqt6_qt6-6.10.0-py3-none-manylinux_2_34_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/4f/f1/f425b5bb96d0f404916256034f2f7de3f6f4922f42ddd1619f3bd5f8b398/pyqt6_qt6-6.10.0-py3-none-manylinux_2_34_x86_64.whl
        sha256: 918441ff5ad5d57386ec72f0d9f5c0b35f5889856f3d2f7b62215d7507515f72

  - name: python3-pyqt6-sip
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pyqt6_sip-13.10.2-cp313-cp313-manylinux_2_5_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/8b/c9/2c4d03a8a6ad8d794c67e07e8538f7f6ec1f7fef18f0452e98b39f473d75/pyqt6_sip-13.10.2-cp313-cp313-manylinux_2_5_x86_64.whl
        sha256: 35d34f6a209be2de4f3b6f6a2f5d6f9f9dd1804f1f2a42b3b7807f8f458721b0

  - name: python3-pyqt6
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pyqt6-6.10.0-1-cp39-abi3-manylinux_2_34_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/c1/32/1d84ab75795b0984935e32d2a51200b94328a45954c28360a97d02f1c376/pyqt6-6.10.0-1-cp39-abi3-manylinux_2_34_x86_64.whl
        sha256: 7f679ec7f8e70f17fc694d722a64554f2bf120ff3ecfce2611310ec91ef1ca0f

  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps numpy-2.3.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/1d/0f/571b2c7a3833ae419fe69ff7b479a78d313581785203cc70a8db90121b9a/numpy-2.3.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 938065908d1d869c7d75d8ec45f735a034771c6ea07088867f713d1cd3bbbe4f

  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pillow-12.0.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f2/2f/d7675ecae6c43e9f12aa8d58b6012683b20b6edfbdac7abcb4e6af7a3784/pillow-12.0.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: e31828b9f645802e3f5762818ea689ad131d55d4c7185ca1dd07fac24203c218

  - name: python3-rdkit
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps rdkit-2025.9.5-cp313-cp313-manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5e/c2/41b6344807a63fb8367be2f3a503d13d22d6d905c2254091e1c2004fd3bc/rdkit-2025.9.5-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 6fd443a12fc14a8258629d08916d39080a470b839d5a91c2275cc48fe93712f2

  - name: chemuson
    buildsystem: simple
    build-commands:
      # El update en Flatpak se delega a flatpak/remote oficial.
      - pip3 install --prefix=/app --no-build-isolation --no-deps .
      - install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.desktop /app/share/applications/io.github.PJGV333.Chemuson.desktop
      - install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.metainfo.xml /app/share/metainfo/io.github.PJGV333.Chemuson.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.svg /app/share/icons/hicolor/scalable/apps/io.github.PJGV333.Chemuson.svg
    sources:
      - type: dir
        path: ../..
