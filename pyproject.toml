[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemuson"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "PyQt6",
  "numpy",
  "Pillow",
  "rdkit",
]

[project.scripts]
chemuson = "chemuson.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemuson = ["assets/**/*", "**/*.png", "**/*.svg", "**/*.json", "**/*.ui", "**/*.mol"]
