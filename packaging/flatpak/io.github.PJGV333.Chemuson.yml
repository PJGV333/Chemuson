app-id: io.github.PJGV333.Chemuson
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: chemuson

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --env=CHEMUSON_DISABLE_UPDATE_CHECK=1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: python3-pyqt6-qt6
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pyqt6_qt6-6.10.0-py3-none-manylinux_2_34_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/c1/32/1d84ab75795b0984935e32d2a51200b94328a45954c28360a97d02f1c376/pyqt6_qt6-6.10.0-py3-none-manylinux_2_34_x86_64.whl
        sha256: cd38b281bb7229b8114f13126aacd77f831a97105fdb1d900260a48ead8c9fcd

  - name: python3-pyqt6-sip
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pyqt6_sip-13.10.2-cp313-cp313-manylinux_2_5_x86_64.manylinux1_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b0/1e/c6a28a142f14e735088534cc92951c3f48cccd77cdd4f3b10d7996be420f/pyqt6_sip-13.10.2-cp313-cp313-manylinux_2_5_x86_64.manylinux1_x86_64.whl
        sha256: 3dde8024d055f496eba7d44061c5a1ba4eb72fc95e5a9d7a0dbc908317e0888b

  - name: python3-pyqt6
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pyqt6-6.10.0-1-cp39-abi3-manylinux_2_34_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f8/99/ca0386e84e39e4f2ef30322f1d39d515f2a3efbc542cccb33e65a1cf7c46/pyqt6-6.10.0-1-cp39-abi3-manylinux_2_34_x86_64.whl
        sha256: 54b6b022369e4e6ade8cf79c0f988558839df7b2c285f814b4567d15a0fcb756

  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps numpy-2.3.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/1d/0f/571b2c7a3833ae419fe69ff7b479a78d313581785203cc70a8db90121b9a/numpy-2.3.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 938065908d1d869c7d75d8ec45f735a034771c6ea07088867f713d1cd3bbbe4f

  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pillow-12.0.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/38/57/755dbd06530a27a5ed74f8cb0a7a44a21722ebf318edbe67ddbd7fb28f88/pillow-12.0.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: f4f1231b7dec408e8670264ce63e9c71409d9583dd21d32c163e25213ee2a344

  - name: python3-rdkit
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps rdkit-2025.9.5-cp313-cp313-manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5e/c2/41b6344807a63fb8367be2f3a503d13d22d6d905c2254091e1c2004fd3bc/rdkit-2025.9.5-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 6fd443a12fc14a8258629d08916d39080a470b839d5a91c2275cc48fe93712f2

  - name: chemuson
    buildsystem: simple
    build-commands:
      # El update en Flatpak se delega a flatpak/remote oficial.
      - pip3 install --prefix=/app --no-build-isolation --no-deps .
      - install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.desktop /app/share/applications/io.github.PJGV333.Chemuson.desktop
      - install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.metainfo.xml /app/share/metainfo/io.github.PJGV333.Chemuson.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.PJGV333.Chemuson.svg /app/share/icons/hicolor/scalable/apps/io.github.PJGV333.Chemuson.svg
    sources:
      - type: dir
        path: ../..
